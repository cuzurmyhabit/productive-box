name: Update gist
on:
  workflow_dispatch:
  push:
    branches:
      - master
  schedule:
    - cron: "0 0 * * *"
permissions:
  contents: read
jobs:
  update-gist:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate GitHub token
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user > /dev/null
      - name: Update gist
        uses: maxam2017/productive-box@89f16a40b4a871f415f46b9245d048d28c288dc5
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          TIMEZONE: Asia/Seoul
